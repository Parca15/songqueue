version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: songqueue_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-songqueue}
      MYSQL_USER: ${DB_USER:-songqueue}
      MYSQL_PASSWORD: ${DB_PASSWORD:-songqueue_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: songqueue_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://${DB_USER:-songqueue}:${DB_PASSWORD:-songqueue_pass}@db:3306/${DB_NAME:-songqueue}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  mysql_data:
