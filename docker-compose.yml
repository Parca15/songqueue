services:
  db:
    image: mysql:8.0
    container_name: songqueue_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: songqueue
      MYSQL_USER: songqueue
      MYSQL_PASSWORD: songqueue_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: songqueue_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app

  # Túnel Cloudflare (demo pública sin abrir puertos).
  # Uso: CLOUDFLARE_TUNNEL_TOKEN=xxx docker compose --profile tunnel up -d
  # Requiere SERVER_BASE_URL=https://tu-dominio para QR válidos.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: songqueue_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-sin-token}
    depends_on:
      - nginx
    profiles:
      - tunnel

  app:
    build: .
    container_name: songqueue_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://songqueue:${DB_PASSWORD:?Define DB_PASSWORD en .env}@db:3306/songqueue
      - SECRET_KEY=${SECRET_KEY:?Define SECRET_KEY en .env (openssl rand -hex 32)}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://Jeysons-MacBook-Pro.local}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
