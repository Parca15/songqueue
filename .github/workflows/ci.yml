name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0 isort==5.13.2 flake8==7.1.1
      - name: Check formatting and lint
        run: |
          black --check src/ tests/
          isort --check-only src/ tests/
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        env:
          # La suite usa SQLite temporal (conftest); MySQL no es necesario.
          SECRET_KEY: ci-secret-key-de-al-menos-32-caracteres
        run: |
          pytest -q --cov=src --cov-report=term --cov-report=xml --cov-fail-under=50
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate inline scripts
        run: |
          for f in frontend/index.html frontend/join.html frontend/admin.html frontend/player.html; do
            python3 -c "
import re, sys
h = open('$f').read()
scripts = re.findall(r'<script>(.*?)</script>', h, re.S)
open('/tmp/check.js', 'w').write(scripts[-1])
"
            node --check /tmp/check.js && echo "$f OK"
          done
