server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # Cabeceras de seguridad (TLS la termina Cloudflare/tu proxy)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Archivos estáticos del frontend. La raíz es el panel admin;
    # las demás ventanas se abren desde ahí o vía QR.
    root /usr/share/nginx/html;
    index admin.html;

    # Compatibilidad con QRs impresos (/?venue=<id> -> cliente legacy).
    # Sin ?venue=, la raíz sirve el admin.
    location = / {
        if ($arg_venue) {
            rewrite ^ /index.html last;
        }
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
    }

    # API: proxy a FastAPI
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets
    location /ws/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Frontend: servir archivos estáticos, fallback al admin
    location / {
        try_files $uri $uri/ /admin.html;
        add_header Cache-Control "no-store";
    }

    # Join route: servir join.html
    location /join/ {
        try_files $uri /join.html;
        add_header Cache-Control "no-store";
    }
}
