<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongQueue - Elegir Canción</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        header h1 { font-size: 2rem; margin-bottom: 8px; }
        header p { color: #888; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input {
            flex: 1; padding: 14px 18px; border-radius: 12px;
            border: 1px solid #333; background: #1a1a1a; color: #fff;
            font-size: 16px; outline: none;
        }
        .search-box input:focus { border-color: #e91e63; }
        .search-box button {
            padding: 14px 24px; border-radius: 12px; border: none;
            background: #e91e63; color: #fff; font-size: 16px;
            cursor: pointer; font-weight: 600;
        }
        .search-box button:hover { background: #c2185b; }
        .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }
        .results { display: flex; flex-direction: column; gap: 10px; }
        .song-card {
            display: flex; align-items: center; gap: 14px;
            padding: 12px; border-radius: 12px; background: #1a1a1a;
            border: 1px solid #333; cursor: pointer; transition: all 0.2s;
        }
        .song-card:hover { border-color: #e91e63; background: #222; }
        .song-card img { width: 80px; height: 60px; border-radius: 8px; object-fit: cover; }
        .song-info { flex: 1; }
        .song-info h3 { font-size: 14px; margin-bottom: 4px; line-height: 1.3; }
        .song-info p { font-size: 12px; color: #888; }
        .song-card .add-btn {
            padding: 8px 16px; border-radius: 8px; border: none;
            background: #4caf50; color: #fff; font-size: 13px;
            cursor: pointer; font-weight: 600;
        }
        .song-card .add-btn:hover { background: #45a049; }
        .song-card .add-btn:disabled { background: #555; cursor: not-allowed; }
        .queue-section { margin-top: 30px; }
        .queue-section h2 { font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .queue-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: 10px; background: #1a1a1a;
            border: 1px solid #333; margin-bottom: 8px;
        }
        .queue-item.playing { border-color: #e91e63; background: #2a1a1a; }
        .queue-item img { width: 60px; height: 45px; border-radius: 6px; object-fit: cover; }
        .queue-item .pos { width: 28px; height: 28px; border-radius: 50%;
            background: #333; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
        }
        .queue-item.playing .pos { background: #e91e63; }
        .queue-info { flex: 1; }
        .queue-info h4 { font-size: 13px; margin-bottom: 2px; }
        .queue-info p { font-size: 11px; color: #888; }
        .status-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .status-playing { background: #e91e63; }
        .status-pending { background: #333; color: #aaa; }
        .empty { text-align: center; color: #666; padding: 40px; }
        .error { background: #3a1a1a; color: #ff6b6b; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .success { background: #1a3a1a; color: #6bff6b; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .fingerprint { font-size: 11px; color: #444; text-align: center; margin-top: 20px; }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 SongQueue</h1>
            <p id="venue-name">Cargando local...</p>
        </header>

        <div id="message"></div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Buscar canción en YouTube..." onkeypress="if(event.key==='Enter') searchSongs()">
            <button id="search-btn" onclick="searchSongs()">Buscar</button>
        </div>

        <div id="search-results" class="results"></div>

        <div class="queue-section">
            <h2>📋 Cola Actual</h2>
            <div id="queue-list"></div>
        </div>

        <div class="fingerprint" id="fingerprint-display"></div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let venueId = null;
        let deviceFingerprint = localStorage.getItem('sq_fingerprint') || generateFingerprint();
        let ws = null;

        // Generar fingerprint del dispositivo
        function generateFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('SongQueue fingerprint', 2, 2);
            const fp = canvas.toDataURL() + navigator.userAgent + screen.width + screen.height;
            const hash = btoa(fp).substring(0, 32);
            localStorage.setItem('sq_fingerprint', hash);
            return hash;
        }

        // Obtener venue_id de la URL (join/:token o ?venue=:id)
        function getVenueId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('venue');
        }

        async function init() {
            venueId = getVenueId();
            if (!venueId) {
                document.getElementById('venue-name').textContent = 'Error: No se especificó un local';
                return;
            }

            document.getElementById('fingerprint-display').textContent = `Device: ${deviceFingerprint}`;

            // Cargar info del local
            try {
                const res = await fetch(`${API_URL}/api/v1/venues/${venueId}`);
                const venue = await res.json();
                document.getElementById('venue-name').textContent = venue.name;
            } catch (e) {
                console.error(e);
            }

            // Cargar cola inicial
            loadQueue();

            // Conectar WebSocket
            connectWebSocket();
        }

        function connectWebSocket() {
            const wsUrl = API_URL.replace('http', 'ws') + `/ws/venue/${venueId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                ws.send(JSON.stringify({ action: 'register', role: 'client', device_id: deviceFingerprint }));
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'queue_updated') {
                    renderQueue(msg.data);
                } else if (msg.type === 'now_playing') {
                    loadQueue();
                }
            };

            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };
        }

        async function searchSongs() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const btn = document.getElementById('search-btn');
            btn.disabled = true;
            btn.textContent = 'Buscando...';

            try {
                const res = await fetch(`${API_URL}/api/v1/songs/search?q=${encodeURIComponent(query)}&limit=10`);
                const songs = await res.json();
                renderSearchResults(songs);
            } catch (e) {
                showMessage('Error al buscar', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Buscar';
            }
        }

        function renderSearchResults(songs) {
            const container = document.getElementById('search-results');
            if (!songs.length) {
                container.innerHTML = '<div class="empty">No se encontraron resultados</div>';
                return;
            }
            container.innerHTML = songs.map(song => `
                <div class="song-card">
                    <img src="${song.thumbnail_url}" alt="">
                    <div class="song-info">
                        <h3>${escapeHtml(song.title)}</h3>
                        <p>${escapeHtml(song.channel)}</p>
                    </div>
                    <button class="add-btn" onclick="addToQueue('${song.youtube_id}', this)">Agregar</button>
                </div>
            `).join('');
        }

        async function addToQueue(youtubeId, btn) {
            btn.disabled = true;
            btn.textContent = '...';

            try {
                const res = await fetch(`${API_URL}/api/v1/queue/venue/${venueId}/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        youtube_id: youtubeId,
                        device_fingerprint: deviceFingerprint,
                        requested_by: 'Cliente',
                    }),
                });

                if (res.ok) {
                    showMessage('✅ Canción agregada a la cola', 'success');
                    document.getElementById('search-results').innerHTML = '';
                    document.getElementById('search-input').value = '';
                    loadQueue();
                } else {
                    const err = await res.json();
                    showMessage('❌ ' + (err.detail || 'Error'), 'error');
                }
            } catch (e) {
                showMessage('Error de conexión', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Agregar';
            }
        }

        async function loadQueue() {
            try {
                const res = await fetch(`${API_URL}/api/v1/queue/venue/${venueId}`);
                const data = await res.json();
                renderQueue(data);
            } catch (e) {
                console.error(e);
            }
        }

        function renderQueue(data) {
            const container = document.getElementById('queue-list');
            let html = '';

            if (data.now_playing) {
                html += renderQueueItem(data.now_playing, 0, true);
            }

            if (data.upcoming && data.upcoming.length) {
                html += data.upcoming.map((item, idx) => renderQueueItem(item, idx + 1, false)).join('');
            }

            if (!data.now_playing && (!data.upcoming || !data.upcoming.length)) {
                html = '<div class="empty">La cola está vacía. ¡Sé el primero en agregar una canción!</div>';
            }

            container.innerHTML = html;
        }

        function renderQueueItem(item, position, isPlaying) {
            const song = item.song || {};
            return `
                <div class="queue-item ${isPlaying ? 'playing' : ''}">
                    <div class="pos">${isPlaying ? '▶' : position}</div>
                    <img src="${song.thumbnail_url || ''}" alt="">
                    <div class="queue-info">
                        <h4>${escapeHtml(song.title || 'Desconocido')}</h4>
                        <p>${escapeHtml(song.channel || '')} ${item.requested_by ? '• Pedido por: ' + escapeHtml(item.requested_by) : ''}</p>
                    </div>
                    <span class="status-badge ${isPlaying ? 'status-playing' : 'status-pending'}">
                        ${isPlaying ? 'Reproduciendo' : 'En cola'}
                    </span>
                </div>
            `;
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => el.innerHTML = '', 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
