<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>SongQueue — Reproductor</title>
    <link rel="stylesheet" href="/design-system.css">
    <script src="https://cdn.jsdelivr.net/npm/motion@11/dist/motion.js" defer></script>
    <script src="/motion.js" defer></script>
    <style>
        body { background: #000; color: #fff; overflow: hidden; font-optical-sizing: auto; }
        #player-container { position: fixed; inset: 0; }
        #youtube-player { width: 100%; height: 100%; }
        .overlay { position: fixed; top: max(1.25rem, env(safe-area-inset-top)); left: 1.25rem; right: 1.25rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; pointer-events: none; z-index: 100; }
        .now-playing-info { padding: 0.9rem 1.5rem; max-width: 31rem; will-change: transform, opacity; }
        .now-playing-info h2 { font-size: 1.15rem; margin-bottom: 0.3rem; font-weight: 700; letter-spacing: -0.01em; }
        .now-playing-info p { font-size: 0.9rem; }
        .queue-preview { padding: 0.9rem; min-width: 15.5rem; pointer-events: auto; }
        .queue-preview h3 { font-size: 0.8rem; margin-bottom: 0.625rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
        .queue-preview-item { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.8rem; }
        .queue-preview-item img { width: 2.5rem; height: 1.875rem; border-radius: 4px; object-fit: cover; background: rgba(255,255,255,0.1); }
        .queue-preview-item span { color: rgba(255,255,255,0.85); font-weight: 500; letter-spacing: 0.01em; }
        .venue-badge { position: fixed; bottom: max(1.25rem, env(safe-area-inset-bottom)); right: 1.25rem; padding: 0.625rem 1.25rem; font-size: 0.9rem; color: rgba(255,255,255,0.75); font-weight: 500; letter-spacing: 0.02em; }
        .connecting { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; z-index: 200; }
        .connecting h1 { font-size: 2rem; margin-bottom: 0.625rem; letter-spacing: -0.022em; }
        .connecting p { color: #888; }
        .skip-wait { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 1.375rem 2.8rem; font-size: 1.3rem; z-index: 300; text-align: center; }
        .skip-wait small { display: block; color: var(--accent); margin-top: 0.625rem; font-size: 1.1rem; }

        @media (max-width: 43.75rem) {
            .now-playing-info h2 { font-size: 1rem; }
            .now-playing-info p { font-size: 0.8rem; }
            .queue-preview { min-width: 11rem; }
            .skip-wait { font-size: 1.1rem; padding: 1rem 1.875rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .now-playing-info { transform: none !important; }
        }
    </style>
</head>
<body>
    <div id="connecting" class="connecting"><h1>SongQueue</h1><p>Conectando al local…</p></div>
    <div id="player-container" class="hidden">
        <div id="youtube-player"></div>
    </div>
    <div class="overlay hidden" id="overlay">
        <div class="now-playing-info player-glass" id="np-card"><h2 id="np-title">Esperando canción…</h2><p id="np-channel">—</p></div>
        <div class="queue-preview player-glass"><h3>Siguientes</h3><div id="queue-preview-list"></div></div>
    </div>
    <div class="venue-badge player-glass hidden" id="venue-badge">Local desconocido</div>
    <div id="skip-wait" class="skip-wait player-glass hidden">Preparando siguiente canción…<small id="skip-wait-count"></small></div>
    <script>
        // window.SQ_API_URL permite apuntar a otra API (deploys split).
        var API_URL = window.SQ_API_URL || window.location.origin;
        var venueId = new URLSearchParams(window.location.search).get('venue');
        var ws = null, player = null, currentVideoId = null;
        var stuckTimer = null, hasPlayed = false;
        var skipLock = false;

        function cancelWait() {
            var el = document.getElementById('skip-wait');
            if (el) el.classList.add('hidden');
        }

        function loadYouTubeAPI() {
            var tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        }

        function disableCaptions() {
            // Fuerza subtítulos apagados: cc_load_policy solo evita el default,
            // hay que descargar el módulo y vaciar la pista en cada reproducción.
            if (!player) return;
            try { player.unloadModule('captions'); } catch (e) {}
            try { player.setOption('captions', 'track', {}); } catch (e) {}
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0, cc_lang_pref: '', hl: 'es', enablejsapi: 1 },
                events: { onReady: function() { disableCaptions(); }, onStateChange: onPlayerStateChange, onError: onPlayerError }
            });
        }

        function showSkipMessage(msg) {
            var el = document.getElementById('skip-wait');
            if (el && el.firstChild) el.firstChild.nodeValue = msg;
            if (el) {
                el.classList.remove('hidden');
                if (window.SQMotion) SQMotion.enter(el, { y: 12 });
            }
            setTimeout(function() { if (el) el.classList.add('hidden'); }, 3000);
        }

        function startStuckTimer(ms, onStuck) {
            clearTimeout(stuckTimer);
            hasPlayed = false;
            stuckTimer = setTimeout(function() {
                if (!hasPlayed && currentVideoId) {
                    onStuck && onStuck();
                }
            }, ms);
        }

        function onPlayerError(e) {
            console.log('YouTube error: ' + e.data);
            clearTimeout(stuckTimer);
            showSkipMessage('Este video no se puede reproducir (bloqueado por YouTube)');
            autoSkip(true);
        }

        function onPlayerStateChange(e) {
            if (e.data === YT.PlayerState.PLAYING) {
                hasPlayed = true;
                clearTimeout(stuckTimer);
                disableCaptions();
            } else if (e.data === YT.PlayerState.ENDED) {
                clearTimeout(stuckTimer);
                autoSkip(false);
            } else if (e.data === YT.PlayerState.BUFFERING && hasPlayed) {
                clearTimeout(stuckTimer);
            }
        }

        async function autoSkip(isFailure) {
            // Protección: solo saltar UNA vez por canción. El evento 'error',
            // play().catch() y 'ended' pueden dispararse juntos; sin este guard
            // una misma canción fallida consumiría varias de la cola.
            if (skipLock) return;
            skipLock = true;
            clearTimeout(stuckTimer);
            cancelWait();

            // Detener la reproducción actual para evitar más eventos de error/ended
            try {
                if (player && player.stopVideo) {
                    player.stopVideo();
                }
            } catch(e) {}

            try {
                await fetch(API_URL + '/api/v1/queue/venue/' + venueId + '/auto-skip', { method: 'POST' });
            } catch(e) {}
        }

        async function init() {
            if (!venueId) {
                document.querySelector('.connecting p').textContent = 'Error: Especifica ?venue=ID';
                return;
            }
            try {
                var res = await fetch(API_URL + '/api/v1/venues/' + venueId);
                var v = await res.json();
                document.getElementById('venue-badge').textContent = v.name;
                document.getElementById('venue-badge').classList.remove('hidden');
            } catch(e) {}
            loadYouTubeAPI();
            connectWebSocket();
        }

        function connectWebSocket() {
            var wsUrl = API_URL.replace('http', 'ws') + '/ws/venue/' + venueId;
            ws = new WebSocket(wsUrl);
            ws.onopen = function() {
                ws.send(JSON.stringify({action: 'register', role: 'player'}));
                document.getElementById('connecting').classList.add('hidden');
                document.getElementById('player-container').classList.remove('hidden');
                document.getElementById('overlay').classList.remove('hidden');
                loadCurrentQueue();
            };
            ws.onmessage = function(e) {
                var msg = JSON.parse(e.data);
                if (msg.type === 'play_song') playSong(msg.data);
                else if (msg.type === 'queue_updated') updatePreview(msg.data);
                else if (msg.type === 'player_command') handleCmd(msg.command);
            };
            ws.onclose = function() { setTimeout(connectWebSocket, 3000); };
        }

        async function loadCurrentQueue() {
            try {
                var res = await fetch(API_URL + '/api/v1/queue/venue/' + venueId);
                var data = await res.json();
                if (data.now_playing) playSong(data.now_playing);
                updatePreview(data);
            } catch(e) {}
        }

        function playSong(item) {
            var s = item.song || {};
            var vid = s.youtube_id;
            if (!vid) return;

            // Al ingresar una cancion se arranca el chequeo: si en 6s no
            // reproduce, se muestra aviso y se salta a la siguiente.
            if (vid !== currentVideoId) {
                cancelWait();
                currentVideoId = vid;
                skipLock = false;
                hasPlayed = false;
                clearTimeout(stuckTimer);
                // Reproducir siempre via YouTube embebido (video con su propio audio).
                if (player && player.loadVideoById) {
                    player.loadVideoById(vid);
                    try { if (player.playVideo) player.playVideo(); } catch(e) {}
                    // YouTube embebido debe arrancar rapido; si en 6s no
                    // reproduce, mostrar aviso y saltar.
                    startStuckTimer(6000, function() {
                        console.log('YouTube no inicia, saltando...');
                        showSkipMessage('Video no disponible, saltando...');
                        autoSkip(true);
                    });
                }
            }
            document.getElementById('np-title').textContent = s.title || 'Desconocido';
            document.getElementById('np-channel').textContent = s.channel || '—';
            // Transición materializada del now-playing (§12): blur+scale, mismo eje (§7)
            if (window.SQMotion) SQMotion.enter(document.getElementById('np-card'), { y: 10 });
        }

        function updatePreview(data) {
            var c = document.getElementById('queue-preview-list');
            if (!data.upcoming || !data.upcoming.length) {
                c.innerHTML = '<div style="color:rgba(255,255,255,0.5);font-size:0.8rem;">Sin canciones pendientes</div>';
                return;
            }
            c.innerHTML = data.upcoming.slice(0,5).map(function(it) {
                var s = it.song || {};
                return '<div class="queue-preview-item"><img src="' + (s.thumbnail_url||'') + '" alt="" loading="lazy"><span>' + escapeHtml((s.title||'Desconocido')).substring(0,30) + '...</span></div>';
            }).join('');
        }

        function escapeHtml(s) {
            var d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function handleCmd(cmd) {
            clearTimeout(stuckTimer);
            if (cmd === 'skip') {
                if (player && player.stopVideo) player.stopVideo();
                return;
            }
            if (player) {
                if (cmd === 'play') player.playVideo();
                else if (cmd === 'pause') player.pauseVideo();
            }
        }

        init();
    </script>
</body>
</html>
