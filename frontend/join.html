<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <title>SongQueue — Unirse</title>
    <link rel="stylesheet" href="design-system.css">
    <script src="https://cdn.jsdelivr.net/npm/motion@11/dist/motion.js" defer></script>
    <script src="motion.js" defer></script>
</head>
<body>
    <div class="client-wrap">
        <header class="app-header hero-center">
            <h1 class="display">SongQueue</h1>
            <p class="venue-sub" id="venue-name">Cargando local…</p>
        </header>

        <div id="message" aria-live="polite"></div>

        <div class="search-box" role="search">
            <input type="text" id="search-input" placeholder="Buscar canción en YouTube…" aria-label="Buscar canción"
                onkeypress="if(event.key==='Enter') searchSongs()">
            <button id="search-btn" class="btn-primary" onclick="searchSongs()">Buscar</button>
        </div>
        <p class="hint" id="approval-hint" style="text-align:center;margin-bottom:1rem;"></p>

        <div id="search-results" class="results"></div>

        <div class="queue-section">
            <h2><span aria-hidden="true">♪</span> <span id="queue-title">Cola actual</span></h2>
            <div id="queue-list"></div>
        </div>

        <div class="queue-section" id="my-waiting-section" style="display:none">
            <h2><span aria-hidden="true">⏳</span> Mis canciones en espera</h2>
            <p class="waiting-sub">El admin decidirá cuáles pasan a la cola.</p>
            <div id="my-waiting-list"></div>
        </div>

        <div class="fingerprint" id="fingerprint-display"></div>
    </div>

    <div id="name-gate" class="dialog-overlay hidden">
        <div class="dialog-content">
            <div class="sheet-handle"></div>
            <h3>¿Cómo te llamas?</h3>
            <p class="hint">Tu nombre aparecerá junto a tus canciones. No puede estar repetido en este local.</p>
            <input type="text" id="name-input" placeholder="Tu nombre" maxlength="30" autocomplete="off"
                onkeypress="if(event.key==='Enter') submitName()">
            <div class="error-msg" id="name-error"></div>
            <div class="dialog-actions">
                <button class="btn-confirm" id="name-submit-btn" onclick="submitName()">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let venueId = null;
        let deviceFingerprint = localStorage.getItem('sq_fingerprint') || generateFingerprint();
        let displayName = localStorage.getItem('sq_display_name') || '';
        let ws = null;
        let venueRequiresApproval = true;
        let lastNowPlayingId = null;

        function generateFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('SongQueue fingerprint', 2, 2);
            const fp = canvas.toDataURL() + navigator.userAgent + screen.width + screen.height;
            const hash = btoa(fp).substring(0, 32);
            localStorage.setItem('sq_fingerprint', hash);
            return hash;
        }

        async function init() {
            const pathParts = window.location.pathname.split('/');
            const qrToken = pathParts[pathParts.length - 1];

            try {
                const res = await fetch(`${API_URL}/api/v1/venues/token/${qrToken}`);
                if (!res.ok) {
                    document.getElementById('venue-name').textContent = 'Local no encontrado — verifica el QR';
                    return;
                }
                const venue = await res.json();
                venueId = venue.id;
                document.getElementById('venue-name').textContent = venue.name;
                document.getElementById('queue-title').textContent = `Cola en ${venue.name}`;
                document.getElementById('fingerprint-display').textContent = 'Device: ' + deviceFingerprint;
                venueRequiresApproval = venue.require_approval !== false;
                document.getElementById('approval-hint').textContent = venueRequiresApproval
                    ? 'Tus canciones pasan por lista de espera: el admin decide cuáles suenan.'
                    : 'Tus canciones entran directo a la cola.';
                const named = await ensureName();
                if (!named) return;
                loadQueue();
                loadMyWaiting();
                connectWebSocket();
            } catch (e) {
                document.getElementById('venue-name').textContent = 'Error de conexión';
            }
            if (window.SQMotion) SQMotion.pressable(document);
        }

        async function registerName(name) {
            try {
                const res = await fetch(`${API_URL}/api/v1/venues/${venueId}/register-name`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_name: name, device_fingerprint: deviceFingerprint }),
                });
                if (res.ok) return { ok: true };
                if (res.status === 409) return { ok: false, taken: true };
                const err = await res.json().catch(() => ({}));
                return { ok: false, error: err.detail || 'Error al registrar el nombre' };
            } catch (e) {
                return { ok: false, error: 'Error de conexión' };
            }
        }

        function openNameGate() {
            const ov = document.getElementById('name-gate');
            document.getElementById('name-error').textContent = '';
            document.getElementById('name-input').value = displayName;
            ov.classList.remove('hidden');
            if (window.SQMotion) SQMotion.openSheet(ov);
            setTimeout(() => document.getElementById('name-input').focus(), 100);
        }

        function closeNameGate() {
            const ov = document.getElementById('name-gate');
            if (window.SQMotion) SQMotion.closeSheet(ov);
            else ov.classList.add('hidden');
        }

        async function ensureName() {
            if (displayName) {
                const r = await registerName(displayName);
                if (r.ok) return true;
                if (!r.taken) return true; // fallo de red: seguir con el nombre guardado
                displayName = '';
                localStorage.removeItem('sq_display_name');
            }
            return new Promise((resolve) => {
                window._nameResolve = resolve;
                openNameGate();
            });
        }

        async function submitName() {
            const input = document.getElementById('name-input');
            const errEl = document.getElementById('name-error');
            const btn = document.getElementById('name-submit-btn');
            const name = input.value.trim();
            if (!name) { errEl.textContent = 'Escribe tu nombre para entrar'; return; }
            btn.disabled = true;
            const r = await registerName(name);
            btn.disabled = false;
            if (r.ok) {
                displayName = name;
                localStorage.setItem('sq_display_name', name);
                closeNameGate();
                if (window._nameResolve) { window._nameResolve(true); window._nameResolve = null; }
                loadQueue();
                loadMyWaiting();
                connectWebSocket();
            } else if (r.taken) {
                errEl.textContent = 'Ese nombre ya está en uso, elige otro';
                input.select();
            } else {
                errEl.textContent = r.error || 'Error al registrar el nombre';
            }
        }

        function connectWebSocket() {
            const wsUrl = API_URL.replace('http', 'ws') + `/ws/venue/${venueId}`;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                ws.send(JSON.stringify({ action: 'register', role: 'client', device_id: deviceFingerprint }));
            };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'queue_updated') { renderQueue(msg.data); loadMyWaiting(); }
                else if (msg.type === 'now_playing') { loadQueue(); loadMyWaiting(); }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        async function searchSongs() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const btn = document.getElementById('search-btn');
            btn.disabled = true;
            btn.textContent = 'Buscando…';
            document.getElementById('search-results').innerHTML =
                '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

            try {
                const res = await fetch(`${API_URL}/api/v1/songs/search?q=${encodeURIComponent(query)}&limit=10`);
                if (!res.ok) {
                    document.getElementById('search-results').innerHTML = '<div class="msg error">Error al buscar</div>';
                    return;
                }
                const songs = await res.json();
                if (!songs || songs.length === 0) {
                    document.getElementById('search-results').innerHTML =
                        '<div class="empty">Sin resultados para "' + escapeHtml(query) +
                        '"<br><button class="btn" onclick="document.getElementById(\'search-input\').focus()">Reintentar</button></div>';
                    return;
                }
                renderSearchResults(songs);
            } catch (e) {
                document.getElementById('search-results').innerHTML = '<div class="msg error">Error de conexión</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Buscar';
            }
        }

        function renderSearchResults(songs) {
            const container = document.getElementById('search-results');
            container.innerHTML = songs.map(song => `
                <div class="song-card">
                    <img src="${song.thumbnail_url || ''}" alt="" loading="lazy" onerror="this.style.display='none'">
                    <div class="song-info">
                        <h3>${escapeHtml(song.title)}</h3>
                        <p>${escapeHtml(song.channel || '')}</p>
                    </div>
                    <button class="btn btn-ok btn-add" onclick="addToQueue('${song.youtube_id}', '${escapeHtml(song.title).replace(/'/g, "\\'")}', '${escapeHtml(song.channel || '').replace(/'/g, "\\'")}', '${(song.thumbnail_url || '').replace(/'/g, "\\'")}', ${song.duration_seconds || 'null'}, this)">Agregar</button>
                </div>
            `).join('');
            if (window.SQMotion) {
                SQMotion.staggerIn(container.querySelectorAll('.song-card'));
                SQMotion.pressable(container);
            }
        }

        async function addToQueue(youtubeId, title, channel, thumbnailUrl, durationSeconds, btn) {
            btn.disabled = true;
            btn.textContent = '…';
            try {
                const res = await fetch(`${API_URL}/api/v1/queue/venue/${venueId}/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        youtube_id: youtubeId,
                        device_fingerprint: deviceFingerprint,
                        requested_by: displayName || 'Cliente',
                        title: title,
                        channel: channel,
                        thumbnail_url: thumbnailUrl,
                        duration_seconds: durationSeconds,
                    }),
                });

                if (res.ok) {
                    const data = await res.json();
                    if (navigator.vibrate) navigator.vibrate(10);
                    document.getElementById('search-results').innerHTML = '';
                    document.getElementById('search-input').value = '';
                    if (data.status === 'waiting') {
                        showMessage('En lista de espera: el admin decidirá si suena', 'info');
                        loadMyWaiting();
                    } else {
                        showMessage('Canción agregada a la cola', 'success');
                        loadQueue();
                    }
                } else {
                    const err = await res.json();
                    showMessage(err.detail || 'Error al agregar', 'error');
                }
            } catch (e) {
                showMessage('Error de conexión', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Agregar';
            }
        }

        async function loadQueue() {
            if (!venueId) return;
            try {
                const res = await fetch(`${API_URL}/api/v1/queue/venue/${venueId}`);
                const data = await res.json();
                renderQueue(data);
            } catch (e) {}
        }

        function renderQueue(data) {
            const container = document.getElementById('queue-list');
            let html = '';
            if (data.now_playing) html += renderQueueItem(data.now_playing, 0, true);
            if (data.upcoming && data.upcoming.length) html += data.upcoming.map((q, i) => renderQueueItem(q, i + 1, false)).join('');
            if (!data.now_playing && (!data.upcoming || !data.upcoming.length))
                html = '<div class="empty">La cola está vacía. ¡Sé el primero!<br><button class="btn btn-primary" onclick="document.getElementById(\'search-input\').focus()">Buscar canción</button></div>';
            container.innerHTML = html;
            if (window.SQMotion) SQMotion.staggerIn(container.querySelectorAll('.queue-item'));
            // Aviso cuando la canción propia empieza a sonar (solo en el cambio)
            if (data.now_playing && data.now_playing.song) {
                const npId = data.now_playing.id;
                if (npId !== lastNowPlayingId) {
                    lastNowPlayingId = npId;
                    if (displayName && data.now_playing.requested_by === displayName) {
                        showMessage('¡Tu canción está sonando!', 'success');
                        if (navigator.vibrate) navigator.vibrate([15, 50, 15]);
                    }
                }
            } else {
                lastNowPlayingId = null;
            }
        }

        function renderQueueItem(item, position, isPlaying) {
            const song = item.song || {};
            return `
                <div class="queue-item ${isPlaying ? 'playing' : ''}">
                    <div class="pos">${isPlaying ? '&#9654;' : position}</div>
                    <img src="${song.thumbnail_url || ''}" alt="" loading="lazy" onerror="this.style.display='none'">
                    <div class="queue-info">
                        <h4>${escapeHtml(song.title || 'Desconocido')}</h4>
                        <p>${escapeHtml(song.channel || '')} ${item.requested_by ? '- Pedido por: ' + escapeHtml(item.requested_by) : ''}</p>
                    </div>
                    <span class="status-badge ${isPlaying ? 'status-playing' : 'status-pending'}">${isPlaying ? 'Reproduciendo' : 'En cola'}</span>
                </div>
            `;
        }

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.innerHTML = `<div class="msg ${type}">${text}</div>`;
            if (window.SQMotion) SQMotion.toast(el.firstChild);
            clearTimeout(el._t);
            el._t = setTimeout(() => el.innerHTML = '', 4000);
        }

        async function loadMyWaiting() {
            if (!venueId) return;
            try {
                const res = await fetch(`${API_URL}/api/v1/queue/venue/${venueId}/waiting/mine?device_fingerprint=${encodeURIComponent(deviceFingerprint)}`);
                const data = await res.json();
                const section = document.getElementById('my-waiting-section');
                const list = document.getElementById('my-waiting-list');
                if (data.waiting && data.waiting.length) {
                    section.style.display = 'block';
                    list.innerHTML = data.waiting.map(item => {
                        const song = item.song || {};
                        return `
                            <div class="queue-item">
                                <img src="${song.thumbnail_url || ''}" alt="" loading="lazy" onerror="this.style.display='none'">
                                <div class="queue-info">
                                    <h4>${escapeHtml(song.title || 'Desconocido')}</h4>
                                    <p>${escapeHtml(song.channel || '')}</p>
                                </div>
                                <span class="status-badge status-pending">En espera</span>
                            </div>
                        `;
                    }).join('');
                    if (window.SQMotion) SQMotion.staggerIn(list.querySelectorAll('.queue-item'));
                } else {
                    section.style.display = 'none';
                    list.innerHTML = '';
                }
            } catch (e) { console.error(e); }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
